<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>闪碟外卖 · 点餐下单原型</title>
<style>
:root{
  --brand:#FF5A1F; --brand-d:#E8430A; --brand-l:#FFF1EB; --accent:#FFB300;
  --txt:#1F1F1F; --txt2:#5C5C5C; --txt3:#9A9A9A; --line:#F0F0F0; --bg:#F5F6F8;
  --green:#00B578; --red:#FA5151; --card:#fff; --r:12px;
  --sh:0 2px 10px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#22252B;color:var(--txt);display:flex;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
}
/* ============ 手机外壳 ============ */
#stage{display:flex;align-items:center;gap:34px}
#hint{width:250px;color:#9AA0AA;font-size:13px;line-height:1.9}
#hint h3{color:#fff;font-size:16px;margin-bottom:10px}
#hint b{color:var(--accent);font-weight:600}
#hint .k{display:inline-block;background:#31353D;color:#D6DAE1;border-radius:5px;padding:1px 6px;font-size:12px}
#hint ol{padding-left:18px}
#hint li{margin-bottom:5px}
.phone{
  position:relative;width:390px;height:844px;background:#fff;border-radius:44px;
  box-shadow:0 0 0 11px #111318,0 0 0 13px #2C3037,0 30px 70px rgba(0,0,0,.55);
  overflow:hidden;flex:none;
}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#111318;border-radius:16px;z-index:900}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;z-index:880;pointer-events:none;color:var(--txt)}
.statusbar.light{color:#fff}
.viewport{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
@media (max-width:1000px){
  #hint{display:none}
  body{background:#fff;display:block;overflow:auto}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .notch{display:none}
  .statusbar{display:none}
}
/* ============ 屏幕/路由 ============ */
.screen{
  position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  will-change:transform;visibility:hidden;
}
.screen.on{transform:translateX(0);visibility:visible}
.screen.below{transform:translateX(-24%);visibility:visible}
.screen.root{transform:translateX(0)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:14px}
.body::-webkit-scrollbar{width:0}
/* ============ 通用 ============ */
.nav{height:92px;padding:46px 12px 0;display:flex;align-items:center;gap:6px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:10}
.nav .t{flex:1;text-align:center;font-size:17px;font-weight:600}
.ic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--txt);flex:none;cursor:pointer;border-radius:50%}
.ic:active{background:#F2F3F5}
.card{background:var(--card);border-radius:var(--r);margin:10px 12px;padding:14px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.gr{flex:1;min-width:0}
.el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.f11{font-size:11px}.f12{font-size:12px}.f13{font-size:13px}.f15{font-size:15px}.f17{font-size:17px}
.b6{font-weight:600}.b7{font-weight:700}
.c2{color:var(--txt2)}.c3{color:var(--txt3)}.cb{color:var(--brand)}.cg{color:var(--green)}
.tr{text-align:right}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}
.price{color:var(--brand);font-weight:700;font-family:-apple-system,"DIN Alternate",sans-serif}
.price i{font-size:11px;font-style:normal;font-weight:600}
.through{color:var(--txt3);font-size:11px;text-decoration:line-through;margin-left:4px}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;background:#F5F6F8;color:var(--txt2);margin-right:4px;line-height:16px}
.tag.o{background:var(--brand-l);color:var(--brand-d);border:.5px solid #FFD5C2}
.tag.g{background:#E6F9F2;color:#00975F;border:.5px solid #B8EBD8}
.tag.b{background:#EAF2FF;color:#2B6CD9;border:.5px solid #C9DEFF}
.divider{height:1px;background:var(--line);margin:12px 0}
.btn{background:var(--brand);color:#fff;border:none;border-radius:24px;height:44px;font-size:16px;font-weight:600;width:100%;cursor:pointer}
.btn:active{background:var(--brand-d)}
.btn.dis{background:#DCDDE0;color:#fff}
.btn.ghost{background:#fff;color:var(--txt);border:1px solid #DDD}
.chip{padding:6px 12px;border-radius:14px;background:#F5F6F8;font-size:12px;color:var(--txt2);cursor:pointer;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--brand-l);color:var(--brand-d);border-color:var(--brand);font-weight:600}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 12px}
.hscroll::-webkit-scrollbar{height:0}
.stepper{display:flex;align-items:center;gap:9px}
.stepper .m,.stepper .p{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;line-height:1}
.stepper .p{background:var(--brand);color:#fff;font-weight:400}
.stepper .m{border:1.2px solid #CFCFCF;color:#777}
.stepper .n{min-width:16px;text-align:center;font-size:14px;font-weight:600}
.thumb{width:74px;height:74px;border-radius:9px;background:linear-gradient(140deg,#FFF3E8,#FFE2CE);display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.empty{text-align:center;padding:70px 0;color:var(--txt3);font-size:13px}
.empty .e{font-size:52px;display:block;margin-bottom:12px;opacity:.55}
/* ============ 底部 tabbar ============ */
.tabbar{height:64px;background:#fff;border-top:1px solid var(--line);display:flex;flex:none;padding-bottom:6px}
.tabbar .it{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--txt3);cursor:pointer}
.tabbar .it .i{font-size:21px;filter:grayscale(1);opacity:.5}
.tabbar .it.on{color:var(--brand);font-weight:600}
.tabbar .it.on .i{filter:none;opacity:1}
.tabbar .it .bd{position:absolute;transform:translate(14px,-10px);background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* ============ 首页 ============ */
.hero{background:linear-gradient(170deg,var(--brand) 0%,#FF7A3D 55%,#F5F6F8 100%);padding:50px 12px 8px}
.loc{display:flex;align-items:center;gap:4px;color:#fff;font-size:16px;font-weight:600;padding:4px 0}
.loc .sub{font-size:11px;font-weight:400;opacity:.9;margin-left:2px}
.searchbar{background:#fff;border-radius:20px;height:38px;display:flex;align-items:center;padding:0 6px 0 13px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.searchbar .ph{flex:1;color:var(--txt3);font-size:13px}
.searchbar .go{background:var(--brand);color:#fff;font-size:12px;border-radius:15px;padding:6px 14px;font-weight:600}
.katz{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 0;background:#fff;border-radius:var(--r);margin:10px 12px;padding:16px 6px;box-shadow:var(--sh)}
.katz .k{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.katz .k .ci{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;background:var(--brand-l)}
.katz .k span{font-size:11px;color:var(--txt)}
.banner{margin:10px 12px;border-radius:var(--r);overflow:hidden;height:92px;background:linear-gradient(110deg,#FF8A4C,#FF5A1F 60%,#E8430A);color:#fff;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:var(--sh)}
.banner .t{font-size:19px;font-weight:700;letter-spacing:.5px}
.banner .s{font-size:12px;opacity:.92;margin-top:5px}
.banner .e{position:absolute;right:14px;bottom:-6px;font-size:64px;opacity:.28}
.seckill{background:#fff;border-radius:var(--r);margin:10px 12px;padding:13px 0 13px 14px;box-shadow:var(--sh)}
.clock{background:#2B2B2B;color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;font-family:"DIN Alternate",monospace;letter-spacing:.5px}
.skrow{display:flex;gap:12px;overflow-x auto;overflow-x:auto;margin-top:12px;padding-right:14px}
.skrow::-webkit-scrollbar{height:0}
.skcard{width:86px;flex:none;cursor:pointer}
.skcard .im{width:86px;height:86px;border-radius:9px;background:linear-gradient(140deg,#FFF3E8,#FFDCC2);display:flex;align-items:center;justify-content:center;font-size:40px}
.filterbar{position:sticky;top:0;background:var(--bg);z-index:6;padding:8px 0 6px;display:flex;gap:8px;overflow-x:auto}
.filterbar::-webkit-scrollbar{height:0}
.filterbar>div:first-child{margin-left:12px}
.filterbar>div:last-child{margin-right:12px}
.shop{background:#fff;border-radius:var(--r);margin:10px 12px;padding:12px;display:flex;gap:11px;box-shadow:var(--sh);cursor:pointer}
.shop:active{background:#FAFAFA}
.logo{width:66px;height:66px;border-radius:10px;background:linear-gradient(140deg,#FFEFE3,#FFD9BE);display:flex;align-items:center;justify-content:center;font-size:33px;flex:none;position:relative}
.logo .bk{position:absolute;bottom:-1px;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:9px;text-align:center;border-radius:0 0 10px 10px;padding:1px 0}
.stars{color:var(--accent);font-size:10px;letter-spacing:-1px}
.promoline{background:#FFF8F4;border-radius:6px;padding:4px 7px;margin-top:6px;font-size:10.5px;color:var(--brand-d);display:flex;gap:6px;align-items:center;overflow:hidden}
/* ============ 店铺详情 ============ */
.shophead{background:linear-gradient(165deg,#4A3226,#7A4B2E 60%,#A9683C);padding:46px 14px 66px;color:#fff;position:relative;overflow:hidden;flex:none}
.shophead .bgm{position:absolute;right:-14px;top:26px;font-size:130px;opacity:.14}
.shophead .nb{display:flex;align-items:center;gap:8px}
.shophead .nb .ic{color:#fff}
.shopinfo{background:#fff;border-radius:var(--r);margin:-56px 12px 0;padding:14px;position:relative;z-index:3;box-shadow:var(--sh)}
.coupbox{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.coupbox::-webkit-scrollbar{height:0}
.coup{flex:none;border:1px dashed var(--brand);color:var(--brand-d);border-radius:5px;padding:3px 8px;font-size:10.5px;background:var(--brand-l);cursor:pointer;display:flex;align-items:center;gap:5px}
.coup.got{border-style:solid;opacity:.5}
.menuwrap{display:flex;flex:1;min-height:0;margin-top:10px}
.catcol{width:88px;background:#F5F6F8;overflow-y:auto;flex:none}
.catcol::-webkit-scrollbar{width:0}
.catcol .c{padding:15px 8px;font-size:12.5px;color:var(--txt2);text-align:center;cursor:pointer;line-height:1.35;position:relative}
.catcol .c.on{background:#fff;color:var(--txt);font-weight:600}
.catcol .c.on:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--brand);border-radius:2px}
.catcol .c .n{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:9px;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.itemcol{flex:1;overflow-y:auto;background:#fff;padding:0 12px}
.itemcol::-webkit-scrollbar{width:0}
.dish{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid #F7F7F7}
.dish .op{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
.specbtn{background:var(--brand);color:#fff;font-size:11.5px;border-radius:13px;padding:5px 11px;font-weight:600;cursor:pointer}
/* 购物车条 */
.cartbar{flex:none;height:56px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:10px;position:relative;z-index:20}
.cartbtn{width:47px;height:47px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;margin-top:-16px;box-shadow:0 4px 12px rgba(255,90,31,.4);cursor:pointer}
.cartbtn.off{background:#C9CACD;box-shadow:none}
.cartbtn .bd{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-weight:600}
.gobtn{background:var(--brand);color:#fff;border-radius:20px;padding:0 20px;height:38px;display:flex;align-items:center;font-size:15px;font-weight:600;cursor:pointer}
.gobtn.dis{background:#E4E5E8;color:#9A9A9A}
/* ============ 遮罩/弹层 ============ */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.25s;z-index:500}
.mask.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:520;max-height:82%;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .sh{padding:15px 16px 10px;font-size:16px;font-weight:600;text-align:center;position:relative;flex:none}
.sheet .sh .x{position:absolute;right:12px;top:12px;font-size:19px;color:var(--txt3);cursor:pointer}
.sheet .sb{overflow-y:auto;padding:0 16px}
.sheet .sb::-webkit-scrollbar{width:0}
.sheet .sf{padding:12px 16px 22px;flex:none;border-top:1px solid var(--line)}
.optgrp{margin-bottom:16px}
.optgrp .gn{font-size:13px;font-weight:600;margin-bottom:9px}
.optgrp .gn em{font-size:10.5px;color:var(--txt3);font-style:normal;font-weight:400;margin-left:5px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:6px 13px;border-radius:15px;background:#F5F6F8;font-size:12.5px;color:var(--txt2);cursor:pointer;border:1px solid transparent}
.opt.on{background:var(--brand-l);color:var(--brand-d);border-color:var(--brand);font-weight:600}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;z-index:900;opacity:0;transition:.2s;pointer-events:none;max-width:76%;text-align:center;line-height:1.5}
.toast.on{opacity:1}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);width:76%;background:#fff;border-radius:14px;z-index:560;opacity:0;visibility:hidden;transition:.22s;overflow:hidden}
.dialog.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.dialog .dt{padding:22px 20px 8px;font-size:16px;font-weight:600;text-align:center}
.dialog .dc{padding:0 20px 18px;font-size:13px;color:var(--txt2);text-align:center;line-height:1.6}
.dialog .da{display:flex;border-top:1px solid var(--line)}
.dialog .da div{flex:1;text-align:center;padding:13px;font-size:15px;cursor:pointer}
.dialog .da div+div{border-left:1px solid var(--line);color:var(--brand);font-weight:600}
/* ============ 结算页 ============ */
.line{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.line:last-child{border-bottom:none}
.line .lv{color:var(--txt2);font-size:13.5px;display:flex;align-items:center;gap:4px;max-width:62%;text-align:right}
.deliverytabs{display:flex;background:#F5F6F8;border-radius:9px;padding:3px;margin-bottom:4px}
.deliverytabs .d{flex:1;text-align:center;padding:8px 0;font-size:13px;border-radius:7px;color:var(--txt2);cursor:pointer}
.deliverytabs .d.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.paybar{flex:none;height:60px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:12px}
.payway{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.payway .pi{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.radio{width:19px;height:19px;border-radius:50%;border:1.5px solid #D5D5D5;flex:none;display:flex;align-items:center;justify-content:center}
.radio.on{border-color:var(--brand);background:var(--brand);color:#fff;font-size:11px}
/* 支付密码 */
.pwd{display:flex;justify-content:center;gap:0;margin:20px 0 6px}
.pwd .d{width:42px;height:44px;border:1px solid #E2E2E2;border-left:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.pwd .d:first-child{border-left:1px solid #E2E2E2;border-radius:7px 0 0 7px}
.pwd .d:last-child{border-radius:0 7px 7px 0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#D8DAE0;margin-top:14px}
.keypad .k{background:#fff;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;cursor:pointer}
.keypad .k:active{background:#E9EAEE}
.keypad .k.gray{background:#EFF0F3;font-size:17px}
.spin{width:44px;height:44px;border:3px solid #F0F0F0;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.okmark{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
/* ============ 订单追踪 ============ */
.trackhead{background:linear-gradient(165deg,var(--brand),#FF8347);color:#fff;padding:46px 16px 18px;flex:none}
.mapbox{margin:-4px 12px 0;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);background:#E8EDF2;position:relative}
.mapbox svg{display:block;width:100%}
.steps{display:flex;margin-top:18px}
.steps .st{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--txt3)}
.steps .st .dot{width:11px;height:11px;border-radius:50%;background:#DCDDE0;margin:0 auto 6px;position:relative;z-index:2}
.steps .st:before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:#E8E9EB}
.steps .st:first-child:before{left:50%}
.steps .st:last-child:before{right:50%}
.steps .st.done{color:var(--brand);font-weight:600}
.steps .st.done .dot{background:var(--brand)}
.steps .st.done:before{background:var(--brand)}
.steps .st.cur .dot{box-shadow:0 0 0 4px rgba(255,90,31,.2);animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px rgba(255,90,31,.06)}}
.rider{display:flex;align-items:center;gap:11px;padding:12px 0 2px}
.rider .av{width:42px;height:42px;border-radius:50%;background:#EAF2FF;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.rider .act{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
/* 评价 */
.starpick{font-size:30px;letter-spacing:6px;color:#DDD;cursor:pointer;user-select:none}
.starpick .on{color:var(--accent)}
textarea{width:100%;border:none;background:#F7F8FA;border-radius:9px;padding:11px;font-size:13.5px;font-family:inherit;resize:none;height:88px;outline:none}
input.tf{width:100%;border:none;font-size:14px;outline:none;text-align:right;font-family:inherit;background:transparent}
/* 我的 */
.mehead{background:linear-gradient(160deg,var(--brand),#FF8A4C);padding:56px 16px 46px;color:#fff;flex:none}
.vipcard{margin:-30px 12px 0;background:linear-gradient(105deg,#3A3226,#5C4A32);border-radius:var(--r);padding:14px;color:#F5DFB8;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.grid4 .g{padding:6px 0;cursor:pointer}
.grid4 .g .n{font-size:18px;font-weight:700}
.menulist .mi{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.menulist .mi:last-child{border-bottom:none}
.menulist .mi .mic{width:26px;text-align:center;font-size:17px}

/* ---------------- 路由 ---------------- */
const SCREENS = {};   // id -> {el, mount}
let stack = ['home'];

function defScreen(id, mount, root){
  const el = document.createElement('div');
  el.className = 'screen' + (root?' root':'');
  el.id = 'sc-'+id;
  vp.insertBefore(el, $('#mask'));
  SCREENS[id] = {el, mount};
}
function paint(){
  Object.keys(SCREENS).forEach(id=>{
    const i = stack.indexOf(id), el = SCREENS[id].el;
    el.classList.remove('on','below');
    if(i === stack.length-1) el.classList.add('on');
    else if(i > -1) el.classList.add('below');
  });
  const top = stack[stack.length-1];
  $('#sbar').classList.toggle('light', ['shop','track','pay'].includes(top));
}
function nav(id, data){
  if(!SCREENS[id]) return;
  const i = stack.indexOf(id);
  if(i > -1) stack.length = i;      // 避免重复入栈
  SCREENS[id].mount(data||{});
  stack.push(id);
  paint();
  SCREENS[id].el.querySelector('.body') && (SCREENS[id].el.querySelector('.body').scrollTop = 0);
}
function back(){
  if(stack.length<=1) return;
  stack.pop();
  const id = stack[stack.length-1];
  SCREENS[id].mount(SCREENS[id].data||{});
  paint();
}
function tabTo(id){ stack = [id]; SCREENS[id].mount({}); paint(); }

/* ---------------- 购物车逻辑 ---------------- */
function findShop(id){ return SHOPS.find(s=>s.id===id); }
function findItem(shopId, itemId){
  const s = findShop(shopId); let r=null;
  s.menu.forEach(c=>c.items.forEach(i=>{ if(i.id===itemId) r=i; }));
  return r;
}
function cartCount(){ return S.cart.items.reduce((a,b)=>a+b.qty,0); }
function cartQtyOf(itemId){ return S.cart.items.filter(i=>i.itemId===itemId).reduce((a,b)=>a+b.qty,0); }
function subtotal(){ return S.cart.items.reduce((a,b)=>a+b.unit*b.qty,0); }
function packFee(){ return S.cart.items.reduce((a,b)=>a+(b.pack||0)*b.qty,0); }

function addToCart(shopId, itemId, specSel, addonSel, qty){
  if(S.cart.shopId && S.cart.shopId!==shopId && S.cart.items.length){
    confirmBox('切换店铺','购物车中已有其他店铺的商品，<br>是否清空并加入本店商品？','清空并加入',()=>{
      S.cart={shopId,items:[]}; addToCart(shopId,itemId,specSel,addonSel,qty);
    });
    return;
  }
  S.cart.shopId = shopId;
  const it = findItem(shopId,itemId);
  const specs = specSel||[], addons = addonSel||[];
  let unit = it.price;
  specs.forEach(s=>unit += s.delta);
  addons.forEach(a=>unit += a.price);
  const desc = [...specs.map(s=>s.label), ...addons.map(a=>'+'+a.label)].join('/');
  const key = itemId + '|' + desc;
  const ex = S.cart.items.find(i=>i.key===key);
  if(ex) ex.qty += (qty||1);
  else S.cart.items.push({key,itemId,name:it.name,emoji:it.emoji,unit,base:it.price,desc,pack:it.pack,qty:qty||1});
  refreshShop();
}
function changeQty(key, d){
  const i = S.cart.items.findIndex(x=>x.key===key);
  if(i<0) return;
  S.cart.items[i].qty += d;
  if(S.cart.items[i].qty<=0) S.cart.items.splice(i,1);
  if(!S.cart.items.length) S.cart.shopId = null;
  refreshShop();
  if($('#sheet').classList.contains('on')) openCartSheet();
}
function refreshShop(){
  if(stack.includes('shop') && SCREENS.shop.data) SCREENS.shop.mount(SCREENS.shop.data);
  paint();
}

/* 满减最优 */
function bestPromo(shop, sub){
  let best = 0, txt = '';
  (shop.promos||[]).forEach(([need,amt])=>{ if(sub>=need && amt>best){best=amt;txt=`满${need}减${amt}`;} });
  return {amt:best, txt};
}
function availCoupons(shop, sub){
  const list = [];
  (shop.coupons||[]).forEach(c=>{ if(S.gotCoupons.includes(c.id)) list.push({...c, kind:'店铺券'}); });
  S.platCoupons.forEach(c=>list.push({...c, kind:'平台券'}));
  return list.map(c=>({...c, usable: sub>=c.need}));
}

  const shop = findShop(S.cart.shopId);
  const sub = subtotal();
  const pack = packFee();
  const mode = S.checkout.mode;
  const fee = mode==='self' ? 0 : (mode==='fast' ? shop.fee+1.5 : shop.fee);
  const promo = bestPromo(shop, sub);
  const all = availCoupons(shop, sub);
  const cp = all.find(c=>c.id===(S.checkout.couponId));
  const cpAmt = (cp && cp.usable) ? cp.amt : 0;
  const newUser = 3;   // 新客立减
  let total = sub + pack + fee - promo.amt - cpAmt - newUser;
  if(total < 0.01) total = 0.01;
  return {shop, sub, pack, fee, promo, cp, cpAmt, newUser, total, saved: promo.amt+cpAmt+newUser, mode};
}
const TIMESLOTS = ['尽快送达（预计 %s 分钟）','今天 12:30 - 12:45','今天 13:00 - 13:15','今天 18:00 - 18:15','今天 19:00 - 19:15'];

  const shop = findShop(S.cart.shopId);
  const t = TIMESLOTS[S.checkout.timeIdx];
  return t.replace('%s', shop? shop.mins : 30);
}

  const tick=()=>{
    const el=$('#clk'); if(!el){clearInterval(clkT);return;}
    left = left>0?left-1:0;
    const h=String(Math.floor(left/3600)).padStart(2,'0'),
          m=String(Math.floor(left%3600/60)).padStart(2,'0'),
          s=String(left%60).padStart(2,'0');
    el.textContent=`${h}:${m}:${s}`;
  };
  tick(); clkT=setInterval(tick,1000);

  const c = calc();

  const order = {
    no, shopId: c.shop.id, shopName: c.shop.name, shopEmoji: c.shop.emoji,
    items: JSON.parse(JSON.stringify(S.cart.items)),
    sub:c.sub, pack:c.pack, fee:c.fee, promo:c.promo, cp:c.cp, cpAmt:c.cpAmt,
    newUser:c.newUser, total:c.total, saved:c.saved,
    mode:c.mode, addr:S.addr.find(a=>a.id===S.addrSel),
    time:timeText(), note:S.checkout.note, tableware:S.checkout.tableware,
    pay:payName(), placed: nowStr(), step:0, rated:false,
    eta: c.shop.mins, code: String(Math.floor(1000+Math.random()*9000)),
    rider:{name:'李师傅',plate:'沪A·骑手 2871',phone:'173****4402'},

  S.orders.unshift(order);
  S.curOrder = order;

function trackTitle(o){
  if(o.mode==='self') return o.step>=4?'已完成取餐':'商家备餐中，请到店取餐';
  return ['已下单，等待商家接单…','商家已接单，正在备餐','骑手已到店，正在取餐','骑手已取餐，正在为你送达','订单已送达，请查看'][o.step];
}
function trackSub(o){
  if(o.step>=4) return `取餐码 ${o.code} · 订单号 ${o.no}`;
  const left = Math.max(1, Math.round(o.eta*(1-o.step/4)));
  return `预计 ${left} 分钟后${o.mode==='self'?'可取餐':'送达'} · 取餐码 ${o.code}`;
}
function trackLogs(o){
  const base = [
    ['刚刚','✅ 订单已提交，等待商家确认'],
    ['刚刚','👨‍🍳 商家已接单，开始备餐'],
    ['刚刚','🛵 骑手 '+o.rider.name+' 已到店取餐'],
    ['刚刚','🚀 骑手已取餐，正在配送途中'],
    ['刚刚','📦 订单已送达，祝你用餐愉快'],
  ];
  return base.slice(0, o.step+1).reverse();
}
function moveRider(frac){
  const p = $('#rpath'), g = $('#riderG');
  if(!p||!g) return;
  const len = p.getTotalLength();
  const pt = p.getPointAtLength(len*Math.max(.02, frac));
  g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
}
function runTimer(o){
  clearInterval(S.timer);
  if(o.step>=4) return;
  S.timer = setInterval(()=>{
    if(o.step>=4){ clearInterval(S.timer); return; }
    o.step++;
    if(stack[stack.length-1]==='track') SCREENS.track.mount({no:o.no});
    if(o.step>=4){ clearInterval(S.timer); toast('🎉 订单已送达'); }
  }, 5000);
}
function fastForward(){
  const o = S.curOrder;
  if(!o||o.step>=4) return;
  o.step = Math.min(4, o.step+1);
  SCREENS.track.mount({no:o.no});
  if(o.step>=4){ clearInterval(S.timer); toast('🎉 订单已送达'); }
}
function cancelOrder(no){
  const o = S.orders.find(x=>x.no===no);

    canFree?'商家尚未出餐，取消可全额退款（模拟）。':'商家已出餐，取消需扣除部分餐损费用（模拟）。',

      toast('订单已取消，退款将在 1-3 个工作日到账（模拟）',2200);
      tabTo('orders');
    });
}

        <div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:28px">🧑</div>
        <div class="gr">
          <div class="f17 b7">张小闪</div>
          <div class="f12" style="opacity:.92;margin-top:4px">138****6620 · 已下单 ${S.orders.length} 笔</div>
        </div>
        <div class="ic" style="color:#fff" onclick="toast('设置页为原型占位')">⚙</div>
      </div>
    </div>
    <div class="vipcard" onclick="toast('会员权益为原型占位')">
      <div><div class="f13 b6">闪碟会员 · 每月省 ¥38</div>
      <div class="f11" style="opacity:.8;margin-top:4px">开通享 6 张免配送费券</div></div>
      <div style="background:#F5DFB8;color:#3A3226;border-radius:14px;padding:5px 13px;font-size:12px;font-weight:700">立即开通</div>
    </div>
    <div class="card">
      <div class="grid4">
        <div class="g" onclick="toast('钱包余额 ¥0.00（模拟）')"><div class="n">0.00</div><div class="f11 c3">余额</div></div>
        <div class="g" onclick="nav('mycoupon')"><div class="n">${S.platCoupons.length}</div><div class="f11 c3">优惠券</div></div>
        <div class="g" onclick="toast('积分商城为原型占位')"><div class="n">128</div><div class="f11 c3">积分</div></div>
        <div class="g" onclick="toast('收藏夹为原型占位')"><div class="n">3</div><div class="f11 c3">收藏</div></div>
      </div>
    </div>
    <div class="card menulist">
      <div class="mi" onclick="tabTo('orders')"><span class="mic">📋</span><span class="gr">我的订单</span><span class="c3 f12">${done} 单已完成 ›</span></div>
      <div class="mi" onclick="nav('addr')"><span class="mic">📍</span><span class="gr">收货地址</span><span class="c3 f12">${S.addr.length} 个 ›</span></div>
      <div class="mi" onclick="nav('mycoupon')"><span class="mic">🎟️</span><span class="gr">我的优惠券</span><span class="c3 f12">${S.platCoupons.length} 张可用 ›</span></div>
      <div class="mi" onclick="toast('发票管理为原型占位')"><span class="mic">🧾</span><span class="gr">发票管理</span><span class="c3">›</span></div>
      <div class="mi" onclick="toast('客服会话为原型占位')"><span class="mic">🎧</span><span class="gr">在线客服</span><span class="c3">›</span></div>
      <div class="mi" onclick="resetDemo()"><span class="mic">🔄</span><span class="gr">重置演示数据</span><span class="c3 f12">清空订单与购物车 ›</span></div>
    </div>
    <div class="f11 c3" style="text-align:center;padding:10px 0 22px">闪碟外卖 · 交互原型 v1.0<br>模拟数据，不产生真实交易</div>
  </div>
  ${tabbarHTML('me')}`;
}, false);
defScreen('mycoupon', function(){
  this.el.innerHTML = `
  <div class="nav"><div class="ic" onclick="back()">‹</div><div class="t">我的优惠券</div><div class="ic"></div></div>
  <div class="body">
    <div class="f12 c3" style="padding:14px 16px 0">平台券（${S.platCoupons.length}）</div>
    ${S.platCoupons.map(x=>`
      <div class="card row" style="gap:0;padding:0;overflow:hidden">
        <div style="width:104px;background:linear-gradient(160deg,#FF7A45,#FF5A1F);color:#fff;padding:16px 8px;text-align:center">
          <div style="font-size:26px;font-weight:700">¥${x.amt}</div>
          <div class="f11" style="opacity:.9">${x.need?'满'+x.need+'可用':'无门槛'}</div>
        </div>
        <div class="gr" style="padding:14px"><div class="f14 b6">${x.txt}</div>
        <div class="f11 c3 mt6">全平台通用 · 有效期至 ${x.exp}</div></div>
        <div style="padding-right:14px"><div class="specbtn" onclick="tabTo('home')">去使用</div></div>
      </div>`).join('')}
    <div class="f12 c3" style="padding:14px 16px 0">店铺券（领取后在对应店铺结算可用）</div>
    ${SHOPS.flatMap(s=>(s.coupons||[]).filter(c=>S.gotCoupons.includes(c.id)).map(c=>`
      <div class="card row"><div class="gr"><div class="f14 b6">${c.txt}</div>
      <div class="f11 c3 mt6">${s.name}</div></div>
      <div class="specbtn" onclick="nav('shop',{id:'${s.id}',reset:true})">去点餐</div></div>`)).join('')
      || `<div class="f12 c3" style="padding:12px 16px">暂无已领取的店铺券，去店铺页领取吧</div>`}
  </div>`;
});
function resetDemo(){
  confirmBox('重置演示','将清空全部订单、购物车与已领取的券，恢复初始状态。','重置',()=>{
    clearInterval(S.timer);
    S.orders=[]; S.curOrder=null; S.cart={shopId:null,items:[]}; S.gotCoupons=[];
    S.platCoupons=[{id:'p1',amt:12,need:40,txt:'平台新客券 满40减12',exp:'2026-08-15'},
                   {id:'p2',amt:5,need:20,txt:'午市专享 满20减5',exp:'2026-08-02'}];
    tabTo('home'); toast('演示数据已重置');
  });
}

/* ---------------- 启动 ---------------- */
SCREENS.home.mount({});
paint();
setTimeout(()=>toast('👋 欢迎体验：从首页选一家店，走一遍完整下单流程',2600),600);
</script>
</body>
